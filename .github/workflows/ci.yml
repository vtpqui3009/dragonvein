name: CI
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Gates
        run: npm run gates
      # The gates create artifacts/ and write their first evidence before they can crash,
      # so a red run still hands the critics something. `warn` rather than `ignore`,
      # because an empty upload now means something went wrong early enough to matter and
      # should be visible in the log instead of passing in silence.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artifacts
          path: artifacts/
          if-no-files-found: warn
