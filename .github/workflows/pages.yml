name: Deploy to Pages
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      # `build:pages`, not `build`: it is `npm run build` plus a step that moves the
      # source maps out of `dist/` before the artefact is made. The maps were 2 842 273
      # bytes — 2.1x the whole 1.4 MB gzip budget — served to players who never ask for
      # them. They are kept in `.sourcemaps/` for whoever needs to debug this build.
      - run: npm run build:pages
      # `enablement: true` makes the action turn Pages on through the API and set the
      # build type to GitHub Actions. Without it the first run dies with
      # "Get Pages site failed ... Error: Not Found" (Pages run 37920381521), because the
      # repository has no Pages site to configure yet. This is the only fix available
      # from inside a workflow; if it still 404s, a human has to set
      # Settings -> Pages -> Source -> GitHub Actions once.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
