name: Assets
on:
  workflow_dispatch:
  push:
    paths: ['assetgen/**']

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Headless GL libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libglx-mesa0 libgl1-mesa-dri \
            libxi6 libxxf86vm1 libxrender1 libxfixes3 libxkbcommon0 libsm6 libice6 libgomp1
      - run: pip install bpy
      - name: Render variant sheets and turntables
        env: { LIBGL_ALWAYS_SOFTWARE: '1' }
        run: python3 -I assetgen/render_proof.py
      - uses: actions/upload-artifact@v4
        with:
          name: asset-renders
          path: |
            assetgen/*.png
            artifacts/
          if-no-files-found: warn
