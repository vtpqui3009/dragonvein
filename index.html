<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>DRAGONVEIN</title>
    <style>
      html,body{margin:0;height:100%;background:#070d14;overflow:hidden;
        font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#dbe9f2}
      /* touch-action:none hands every touch to the orbit (src/main.ts) — without it the
         browser takes a pinch as a page zoom and a drag as a pull-to-refresh. */
      #c{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
      #c:active{cursor:grabbing}
      #boot{position:fixed;inset:0;display:grid;place-content:center;gap:12px;
        text-align:center;pointer-events:none;transition:opacity .5s}
      #boot h1{margin:0;font-size:clamp(28px,6vw,56px);letter-spacing:.22em;font-weight:800}
      #boot p{margin:0;opacity:.6;font-size:14px;letter-spacing:.1em}

      /* Overlay — docs/ART_BIBLE.md §Palette: UI surface rgba(11,36,48,0.82),
         UI accent #ffd479. Contrast measured off artifacts/shots/01-wide.png at
         1280x720: accent 11.4:1 and readouts 14.8:1 against the panel as rendered, and
         6.6:1 / 8.6:1 against the worst-case panel composited over the brightest pixel
         in frame. Rubric A7 asks for 4.5:1. */
      /* Wraps instead of clipping. At a fixed one-row 512 px it lost 168 px off a 360 px
         phone, and what fell off was the context-loss line — so a driver reset read as an
         unexplained black screen. max-width keeps the panel's right edge 14 px inside the
         viewport, mirroring `left`; the readout groups wrap whole (each is nowrap), never
         mid-number. At 1280x720 the content is narrower than the cap, so the desktop frame
         the art-critic scores is the same single row it was. */
      #hud{position:fixed;top:14px;left:14px;pointer-events:none;
        display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;
        box-sizing:border-box;max-width:calc(100vw - 28px);
        padding:9px 14px;border-radius:10px;
        background:rgba(11,36,48,0.82);border:1px solid rgba(255,212,121,.38);
        font:600 14px/1.25 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        letter-spacing:.06em;color:#eef7fd}
      #hud .t{color:#ffd479;letter-spacing:.2em}
      #hud .g{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
      #hud .k{color:#ffd479;font-size:11px;text-transform:uppercase;letter-spacing:.14em}
      #hud .v{font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
      /* Shown only when the WebGL context dies. #ff9044 (ART_BIBLE sky horizon) on the
         panel measures 7.1:1, past A7's 4.5:1. */
      #hud .w{color:#ff9044;letter-spacing:.14em;flex-basis:100%;min-width:0;
        overflow-wrap:anywhere}
      /* Phone width: same layout, a size step down so the four readouts take two rows
         rather than four. Labels keep their 11 px; readouts go 14 → 12 px. */
      @media (max-width:480px){
        #hud{top:10px;left:10px;max-width:calc(100vw - 20px);padding:7px 10px;
          gap:3px 10px;font-size:12px}
      }
      /* The save readout keeps its width as "saved 9s ago" becomes "saved 10s ago", so the
         row does not shuffle every ten seconds. Orange when the game is not saving. */
      #hud #hud-save{min-width:13ch;text-align:left}
      #hud #hud-save.off{color:#ff9044}
      /* Recovery actions: the only part of the HUD that takes input. Accent border on the
         panel colour, the panel's own font. */
      #hud .a{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
      #hud .a button{font:inherit;font-size:12px;letter-spacing:.06em;color:#ffd479;cursor:pointer;
        background:rgba(11,36,48,0.95);border:1px solid rgba(255,212,121,.6);border-radius:6px;
        padding:5px 9px;text-align:left;white-space:normal;
        min-height:44px}  /* a touch target: 44 px, as at 360 and 320 px wide (cycle 2, D8) */
      #hud .a button:hover{background:rgba(255,212,121,.12)}
      #hud .a button:focus-visible{outline:2px solid #ffd479;outline-offset:1px}
      #hud [hidden]{display:none}
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="boot"><h1>DRAGONVEIN</h1><p>đang khởi tạo thế giới…</p></div>
    <div id="hud">
      <span class="t">DRAGONVEIN</span>
      <span class="g"><span class="k">build</span><span class="v" id="hud-build">—</span></span>
      <span class="g"><span class="k">fps</span><span class="v" id="hud-fps">—</span></span>
      <span class="g"><span class="k">draws</span><span class="v" id="hud-draws">—</span></span>
      <span class="g"><span class="k">tris</span><span class="v" id="hud-tris">—</span></span>
      <!-- M8a: the world clock (sim ticks at 20 Hz, h:mm:ss), the roster size and the save
           state. When the game will not save, the line under it says why. -->
      <span class="g"><span class="k">world</span><span class="v" id="hud-clock">—</span></span>
      <span class="g"><span class="k">dragons</span><span class="v" id="hud-roster">—</span></span>
      <span class="g"><span class="v" id="hud-save">loading</span></span>
      <span class="w" id="hud-save-note" hidden></span>
      <!-- The way out of a save the game will not write (M8a cycle 2). Nothing here deletes
           anything: "start fresh" moves the old record aside, export downloads it. -->
      <span class="a" id="hud-save-actions" hidden>
        <button type="button" id="hud-save-fresh" hidden></button>
        <button type="button" id="hud-save-export" hidden>export the old save</button>
        <button type="button" id="hud-save-reload" hidden>reload</button>
      </span>
      <!-- Hidden until the GPU context is lost. The readouts above go to em dashes at the
           same moment, because `renderer.info` freezes at its last good values and
           printing them over a dead canvas is the opposite of a diagnostic. -->
      <span class="w" id="hud-status" hidden></span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
